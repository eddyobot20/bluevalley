<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Properties — BlueKey Realty</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">BlueKey<span class="text-warning">.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu2">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu2">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="#">Properties</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-outline-primary" href="property.html">List Property</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row">
      <aside class="col-lg-3 mb-4">
        <div class="card p-3 shadow-sm">
          <h5>Filters</h5>
          <div class="mb-3">
            <label class="form-label small">Location</label>
            <input id="filterLocation" class="form-control" placeholder="City or neighborhood">
          </div>
          <div class="mb-3">
            <label class="form-label small">Type</label>
            <select id="filterType" class="form-select">
              <option value="">Any</option>
              <option>House</option>
              <option>Apartment</option>
              <option>Land</option>
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label small">Min price</label>
            <input id="filterMin" type="number" class="form-control" placeholder="0">
          </div>
          <div class="mb-3">
            <label class="form-label small">Max price</label>
            <input id="filterMax" type="number" class="form-control" placeholder="500000">
          </div>
          <div class="d-grid">
            <button id="applyFilters" class="btn btn-primary">Apply</button>
          </div>
        </div>
      </aside>

      <section class="col-lg-9">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h3 class="mb-0">Properties</h3>
          <div class="text-muted small">Showing <span id="resultCount">0</span> results</div>
        </div>

        <div id="listingsGrid" class="row g-4">
        </div>
      </section>
    </div>
  </main>

  <footer class="bg-white border-top py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <div>&copy; <span id="year2"></span> BlueKey Realty</div>
      <div>
        <a href="#" class="text-muted me-3">Privacy</a>
        <a href="#" class="text-muted">Contact</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
