<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Property — BlueValley Realty</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">BlueValley<span class="text-warning">.</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu3">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu3">
        <ul class="navbar-nav ms-auto align-items-lg-center">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="properties.html">Properties</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item ms-lg-3">
            <a class="btn btn-outline-primary" href="property.html">List Property</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div id="propertyWrapper" class="reveal-up" data-reveal>
      <div id="gallery" class="mb-4">
      </div>

      <div class="row">
        <div class="col-lg-8">
          <h2 id="propTitle">Property Title</h2>
          <div class="mb-3 text-muted" id="propLocation">Location • Type • Size</div>
          <h3 class="text-primary" id="propPrice">$0</h3>
          <p id="propDescription">Description text goes here.</p>

          <h5 class="mt-4">Features</h5>
          <ul id="propFeatures" class="list-unstyled small text-muted">
          </ul>
        </div>

        <aside class="col-lg-4">
          <div class="card shadow-sm p-3">
            <h6>Contact Agent</h6>
            <form id="inquiryForm" class="mt-3">
              <div class="mb-2">
                <input id="name" class="form-control" placeholder="Your name" required>
              </div>
              <div class="mb-2">
                <input id="email" type="email" class="form-control" placeholder="Email" required>
              </div>
              <div class="mb-2">
                <textarea id="message" class="form-control" rows="4" placeholder="Message"></textarea>
              </div>
              <div class="d-grid">
                <button class="btn btn-primary">Send Inquiry</button>
              </div>
            </form>
          </div>
          <div class="mt-3 text-center">
            <button id="favBtn" class="btn btn-outline-warning">Save to favorites</button>
          </div>
        </aside>
      </div>
    </div>
  </main>

  <footer class="bg-white border-top py-4">
    <div class="container d-flex justify-content-between align-items-center">
      <div>&copy; <span id="year3"></span> BlueValley Realty</div>
      <div>
        <a href="#" class="text-muted me-3">Privacy</a>
        <a href="#" class="text-muted">Contact</a>
      </div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
